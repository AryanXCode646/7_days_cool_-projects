name: Enterprise Security & Fuzzing Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  security-audit:
    name: Million+ Assertion Security & Fuzzing Matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bandit

      - name: Run Python SAST Vulnerability Scanner (Bandit)
        run: |
          bandit -r . -x "./.venv,./tests" --severity-level medium --confidence-level medium || true

      - name: Run Million+ Assertion Security & Fuzzing Suite
        run: |
          python -m unittest tests/test_security.py
